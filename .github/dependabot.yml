version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Development dependencies are exact pins (the source gate requires it); each bump
  # updates the manifest and the lockfile together.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/sdk
      - /packages/next
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # The Next fixtures build and test at the declared peer floors, so these move
      # only with a reviewed peer range change.
      - dependency-name: next
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # A major (TypeScript, Node types, Biome) changes what the pair is built and
      # checked with; propose it deliberately rather than in the weekly group.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
