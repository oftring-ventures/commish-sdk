version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Development dependencies are exact pins (the source gate requires it); each bump
  # updates the manifest and the lockfile together.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/sdk
      - /packages/next
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      development:
        dependency-type: development
