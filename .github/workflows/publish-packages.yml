name: Stage approved packages
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Accepted Public source run ID
        required: true
        type: string
      candidate_artifact_id:
        description: Accepted candidate artifact ID from that run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'oftring-ventures/commish-sdk' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publication
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      COMMISH_NPM_ENVIRONMENT: npm-publication
      COMMISH_NPM_APPROVED_SOURCE: ${{ vars.COMMISH_NPM_APPROVED_SOURCE }}
      COMMISH_NPM_APPROVED_MANIFEST_SHA256: ${{ vars.COMMISH_NPM_APPROVED_MANIFEST_SHA256 }}
      COMMISH_NPM_APPROVED_CI_RECEIPT_SHA256: ${{ vars.COMMISH_NPM_APPROVED_CI_RECEIPT_SHA256 }}
      COMMISH_NPM_HOSTED_ACCEPTANCE_SHA256: ${{ vars.COMMISH_NPM_HOSTED_ACCEPTANCE_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned staging CLI
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.21.0
      - name: Verify and stage the approved archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: node scripts/publication-executor.mjs "$CANDIDATE_RUN_ID" "$CANDIDATE_ARTIFACT_ID" --stage > "$RUNNER_TEMP/publication-receipt.json"
      - name: Retain staging receipt, including partial or uncertain outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-receipt.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 30
