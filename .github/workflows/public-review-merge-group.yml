name: Public review merge-group bridge
on:
  merge_group:
    types: [checks_requested]
permissions: {}
jobs:
  review:
    name: ${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the legacy name until both rulesets require Claude.
        gate: [Claude review gate, codex_review / Codex review gate]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: echo 'The merge queue requires review on each admitted PR head.'
