name: Public source
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
# One run per head: a superseded pull-request head is cancelled, while main, tag and
# merge-group runs always finish because their candidates may be handed off. Those
# are grouped by commit, since GitHub cancels a pending run whenever a newer one
# queues in the same group.
concurrency:
  group: public-source-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Public source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm
      # Tests of the shipped packages import dist/, so build the workspace first.
      # node_modules/ and dist/ are git-ignored; the verifier still requires a clean tree.
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - run: pnpm build
      - name: Run every test file
        run: node --test 'scripts/*.test.mjs'
      - name: Prepare exact-source candidate
        run: node scripts/verify-public-source.mjs "$RUNNER_TEMP/commish-candidate"
      - name: Bind candidate to this CI run
        run: node scripts/candidate-ci-receipt.mjs "$RUNNER_TEMP/commish-candidate"
      - name: Retain verified candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-candidate-${{ env.EXPECTED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commish-candidate/
          if-no-files-found: error
          overwrite: false
          retention-days: 30
  runtimes:
    # The release gate above builds on the pinned toolchain; this proves the shipped
    # packages and CLI behave on every Node line the manifests admit.
    name: Package tests on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - run: pnpm build
      - name: Run the package and CLI tests
        run: node --test 'scripts/setup-*.test.mjs' scripts/api-command.test.mjs scripts/headless-command.test.mjs scripts/catalog.test.mjs 'scripts/pages*.test.mjs' scripts/next-metadata.test.mjs
