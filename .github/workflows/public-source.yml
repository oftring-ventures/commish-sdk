name: Public source
on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  source:
    name: Public source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.1.3
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm
      # Tests of the shipped packages import dist/, so build the workspace first.
      # node_modules/ and dist/ are git-ignored; the verifier still requires a clean tree.
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - run: pnpm build
      - name: Run every test file
        run: node --test 'scripts/*.test.mjs'
      - name: Prepare exact-source candidate
        run: node scripts/verify-public-source.mjs "$RUNNER_TEMP/commish-candidate"
      - name: Bind candidate to this CI run
        run: node scripts/candidate-ci-receipt.mjs "$RUNNER_TEMP/commish-candidate"
      - name: Retain verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-candidate-${{ env.EXPECTED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commish-candidate/
          if-no-files-found: error
          overwrite: false
          retention-days: 30
