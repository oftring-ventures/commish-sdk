name: Public source
on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  source:
    name: Public source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.1.3
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm
      - run: node --test scripts/verify-public-source.test.mjs scripts/verify-sdk-browser-consumer.test.mjs scripts/verify-sdk-types.test.mjs scripts/verify-sdk-webhooks.test.mjs scripts/verify-sdk-http.test.mjs scripts/verify-sdk-reads.test.mjs scripts/verify-next-browser-consumer.test.mjs scripts/verify-next-types.test.mjs scripts/inspect-next-build.test.mjs scripts/next-command-scope.test.mjs scripts/verify-framework-package.test.mjs
      - run: node scripts/verify-public-source.mjs
